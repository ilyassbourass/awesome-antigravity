<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="awesomeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a14" />
      <stop offset="50%" stop-color="#121324" />
      <stop offset="100%" stop-color="#06070e" />
    </linearGradient>

    <!-- Magenta / Awesome Glow -->
    <radialGradient id="pinkGlow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fc60a8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#d946ef" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090a14" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan / Gemini Glow -->
    <radialGradient id="cyanGlow" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#090a14" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1c38" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111022" stop-opacity="0.7" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc60a8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#fc60a8" flood-opacity="0.15" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#awesomeBg)" />
  <rect width="1200" height="420" fill="url(#pinkGlow)" />
  <rect width="1200" height="420" fill="url(#cyanGlow)" />

  <!-- Constellation Grid Lines -->
  <g opacity="0.06" stroke="#fc60a8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="240" y1="0" x2="240" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="720" y1="0" x2="720" y2="420" />
    <line x1="880" y1="0" x2="880" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Top Pill -->
  <g transform="translate(60, 48)">
    <rect width="250" height="28" rx="14" fill="#fc60a8" fill-opacity="0.15" stroke="#fc60a8" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#fc60a8" />
    <text x="28" y="19" class="mono" font-size="11" font-weight="600" fill="#fbcfe8" letter-spacing="0.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Star Badge -->
    <rect x="260" y="0" width="135" height="28" rx="14" fill="#06b6d4" fill-opacity="0.15" stroke="#22d3ee" stroke-width="1" />
    <circle cx="274" cy="14" r="4" fill="#22d3ee" />
    <text x="285" y="19" class="mono" font-size="11" font-weight="600" fill="#67e8f9">AGY 2.0 • 2026</text>
  </g>

  <!-- Main Title Area -->
  <g transform="translate(60, 130)">
    <text class="sans" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Awesome Antigravity <tspan fill="#fc60a8">🌟🚀</tspan>
    </text>
    <text y="42" class="sans" font-size="20" font-weight="500" fill="#94a3b8">
      Curated List of Tools, Extensions, Skills &amp; Workflows
    </text>
    <text y="74" class="sans" font-size="14.5" font-weight="400" fill="#64748b">
      The definitive directory for Google DeepMind's agentic AI coding environment.
    </text>
    <text y="96" class="sans" font-size="14.5" font-weight="500" fill="#f472b6">
      Covering CLI commands, autonomous subagents, MCP servers, and SQLite recovery.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 140)">
      <g>
        <rect width="144" height="34" rx="8" fill="#1e1828" stroke="#fc60a8" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#fbcfe8">⏪ Antigravity Rewind</text>
      </g>
      <g transform="translate(154, 0)">
        <rect width="140" height="34" rx="8" fill="#1e1828" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#a5f3fc">💻 Agy CLI &amp; SDK</text>
      </g>
      <g transform="translate(304, 0)">
        <rect width="146" height="34" rx="8" fill="#1e1828" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#e9d5ff">🧩 Modular Skills</text>
      </g>
      <g transform="translate(460, 0)">
        <rect width="134" height="34" rx="8" fill="#1e1828" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
        <text x="14" y="22" class="sans" font-size="12" font-weight="600" fill="#a7f3d0">⚡ Slash Reference</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic: Ecosystem Card -->
  <g transform="translate(680, 50)" filter="url(#shadow)">
    <rect width="460" height="315" rx="18" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Header Bar -->
    <rect width="460" height="42" rx="18" fill="#151426" fill-opacity="0.8" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="76" y="26" class="mono" font-size="12" font-weight="600" fill="#fbcfe8">ECOSYSTEM RADAR • VERIFIED</text>
    <text x="360" y="26" class="mono" font-size="11" font-weight="600" fill="#06b6d4">AWESOME.RE</text>

    <!-- Directory Snippet Items -->
    <g transform="translate(24, 60)">
      <!-- Item 1: Rewind -->
      <rect width="412" height="60" rx="8" fill="#1b162b" stroke="#fc60a8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="24" cy="30" r="12" fill="#fc60a8" fill-opacity="0.2" />
      <text x="17" y="35" class="sans" font-size="14">⏪</text>
      <text x="46" y="25" class="sans" font-size="13" font-weight="700" fill="#ffffff">Antigravity Rewind</text>
      <text x="46" y="44" class="sans" font-size="11" fill="#94a3b8">Surgical in-chat undo &amp; SQLite time machine for AGY</text>
      <rect x="330" y="16" width="68" height="26" rx="6" fill="#fc60a8" />
      <text x="342" y="33" class="mono" font-size="10" font-weight="700" fill="#ffffff">TOOL</text>

      <!-- Item 2: Generative UI -->
      <g transform="translate(0, 70)">
        <rect width="412" height="60" rx="8" fill="#0f192b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="24" cy="30" r="12" fill="#06b6d4" fill-opacity="0.2" />
        <text x="17" y="35" class="sans" font-size="14">📊</text>
        <text x="46" y="25" class="sans" font-size="13" font-weight="700" fill="#ffffff">Generative UI Skill</text>
        <text x="46" y="44" class="sans" font-size="11" fill="#94a3b8">Inline interactive HTML widgets, telemetry charts &amp; diagrams</text>
        <rect x="330" y="16" width="68" height="26" rx="6" fill="#06b6d4" />
        <text x="340" y="33" class="mono" font-size="10" font-weight="700" fill="#ffffff">SKILL</text>
      </g>

      <!-- Item 3: Storage Engine -->
      <g transform="translate(0, 140)">
        <rect width="412" height="60" rx="8" fill="#141924" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="24" cy="30" r="12" fill="#a855f7" fill-opacity="0.2" />
        <text x="17" y="35" class="sans" font-size="14">🏛️</text>
        <text x="46" y="25" class="sans" font-size="13" font-weight="700" fill="#ffffff">6-Layer Storage Internals</text>
        <text x="46" y="44" class="sans" font-size="11" fill="#94a3b8">SQLite steps, JSONL transcript, and 100 KB virtual scroll chunks</text>
        <rect x="330" y="16" width="68" height="26" rx="6" fill="#a855f7" />
        <text x="340" y="33" class="mono" font-size="10" font-weight="700" fill="#ffffff">SPEC</text>
      </g>
    </g>
  </g>
</svg>
